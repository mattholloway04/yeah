<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global Fart Leaderboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Oswald', system-ui, sans-serif;
    color: #f7f7f7;
    background: radial-gradient(circle at 50% 20%, #20394f 0%, #071019 35%, #020406 100%);
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(142, 215, 73, .18), transparent 18%),
      radial-gradient(circle at 80% 35%, rgba(65, 170, 255, .16), transparent 25%),
      linear-gradient(to bottom, transparent 0 54%, rgba(67,132,190,.25) 55%, rgba(5,15,22,.85) 70%);
    pointer-events: none;
  }
  .stars {
    position: fixed; inset: 0; opacity: .35; pointer-events: none;
    background-image: radial-gradient(#fff 1px, transparent 1px);
    background-size: 42px 42px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 24px 18px 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.88), rgba(0,0,0,.55), transparent);
    text-align: center;
    backdrop-filter: blur(5px);
  }
  h1 {
    margin: 0;
    font-family: 'Anton', Impact, sans-serif;
    letter-spacing: 5px;
    font-size: clamp(2.2rem, 6vw, 5.3rem);
    line-height: .95;
    text-shadow: 0 4px 0 #111, 0 0 20px rgba(255,255,255,.22);
  }
  .subtitle {
    margin-top: 14px;
    color: #9be55e;
    letter-spacing: 8px;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 2rem);
    text-shadow: 0 0 12px rgba(155,229,94,.8);
  }
  main { position: relative; z-index: 1; max-width: 1120px; margin: 30px auto 80px; padding: 0 18px; }
  .board {
    border: 2px solid #8ee353;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(0,0,0,.64);
    box-shadow: 0 0 22px rgba(139, 230, 76, .55), inset 0 0 40px rgba(0,0,0,.7);
  }
  .head, .row {
    display: grid;
    grid-template-columns: 150px 1fr 260px;
    align-items: center;
  }
  .head {
    color: #9be55e;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 1.25rem;
    padding: 15px 28px;
    background: rgba(0,0,0,.72);
    border-bottom: 1px solid rgba(142, 227, 83, .45);
  }
  .row {
    min-height: 70px;
    padding: 0 28px;
    border-bottom: 1px solid rgba(255,255,255,.13);
    font-size: clamp(1.15rem, 2.8vw, 2.05rem);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .row:last-child { border-bottom: none; }
  .rank { font-size: 2.2rem; text-align: center; text-shadow: 0 2px 0 #000; }
  .points { text-align: right; letter-spacing: 3px; }
  .champion {
    background: linear-gradient(90deg, rgba(255,210,38,.48), rgba(255,190,20,.16), rgba(255,210,38,.35));
    color: #ffd84d;
    text-shadow: 0 2px 0 #000, 0 0 14px rgba(255,210,38,.65);
    border-top: 2px solid #ffd52f;
    border-bottom: 2px solid #ffd52f;
  }
  .second {
    background: linear-gradient(90deg, rgba(255,210,38,.32), rgba(255,190,20,.10), rgba(255,210,38,.22));
    color: #ffd84d;
    text-shadow: 0 2px 0 #000;
  }
  .bronze .rank { color: #dca06b; }
  .badge { margin-right: 22px; filter: drop-shadow(0 0 8px rgba(255,215,55,.9)); }
  .name { display: flex; align-items: center; }
  .footer-note {
    text-align: center;
    color: #9be55e;
    letter-spacing: 4px;
    font-weight: 700;
    padding: 22px;
  }
  .statbar {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-bottom: 22px;
  }
  .stat {
    border: 1px solid rgba(142,227,83,.65);
    border-radius: 999px;
    padding: 9px 18px;
    background: rgba(0,0,0,.5);
    color: #cfffae;
    box-shadow: 0 0 12px rgba(142,227,83,.2);
    letter-spacing: 1px;
  }
  @media (max-width: 760px) {
    .head, .row { grid-template-columns: 76px 1fr 130px; padding: 0 12px; }
    .head { padding-top: 12px; padding-bottom: 12px; font-size: .95rem; }
    .row { min-height: 58px; }
    .rank { font-size: 1.7rem; }
    .points { letter-spacing: 1px; font-size: 1.05rem; }
    .badge { margin-right: 8px; }
  }
</style>
</head>
<body>
